<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- Gradient for video thumbnails -->
    <linearGradient id="videoGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="videoGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a085;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1abc9c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="videoGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2980b9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="videoGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8e44ad;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="videoGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0392b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="videoGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d35400;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>

    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e74c3c" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#f8f9fa"/>

  <!-- Main window border -->
  <rect x="50" y="50" width="1100" height="800" fill="#ffffff" stroke="#dee2e6" stroke-width="2" rx="5"/>

  <!-- Title bar -->
  <rect x="50" y="50" width="1100" height="35" fill="#343a40" rx="5"/>
  <rect x="50" y="67" width="1100" height="18" fill="#343a40"/>
  <text x="70" y="73" font-family="monospace" font-size="16" fill="#ffffff" font-weight="bold">*Video Thumbnails*</text>

  <!-- Header section - directory info -->
  <rect x="50" y="85" width="1100" height="40" fill="#e9ecef"/>
  <text x="70" y="107" font-family="monospace" font-size="13" fill="#212529" font-weight="bold">Video Thumbnails: ~/Videos/projects  [name ↑]</text>
  <text x="70" y="120" font-family="monospace" font-size="11" fill="#6c757d">Showing 6 of 6 videos | s: sort | /: filter | R: toggle recursive | w: toggle wrap | q: quit</text>

  <!-- Header line - current video info -->
  <rect x="50" y="125" width="1100" height="30" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="70" y="145" font-family="monospace" font-size="13" fill="#212529">
    <tspan fill="#dc3545" font-weight="bold">* </tspan>
    <tspan font-weight="bold">summer_vacation_2024.mp4</tspan>
    <tspan fill="#6c757d">  1920x1080  5:32  124.5 MB</tspan>
  </text>

  <!-- Thumbnail grid area -->
  <g id="thumbnails">
    <!-- Row 1 -->
    <!-- Thumbnail 1 - Marked with red border (current) -->
    <g id="thumb1">
      <rect x="90" y="180" width="250" height="250" fill="url(#videoGrad1)" stroke="#dc3545" stroke-width="6" rx="3"/>
      <text x="215" y="300" font-family="sans-serif" font-size="48" fill="#ecf0f1" text-anchor="middle">▶</text>
      <text x="215" y="230" font-family="monospace" font-size="12" fill="#ecf0f1" text-anchor="middle">summer_vacation</text>
      <text x="215" y="370" font-family="monospace" font-size="11" fill="#ecf0f1" text-anchor="middle">1920x1080 • 5:32</text>
    </g>

    <!-- Thumbnail 2 -->
    <g id="thumb2">
      <rect x="365" y="180" width="250" height="250" fill="url(#videoGrad2)" stroke="#495057" stroke-width="2" rx="3"/>
      <text x="490" y="300" font-family="sans-serif" font-size="48" fill="#ecf0f1" text-anchor="middle">▶</text>
      <text x="490" y="230" font-family="monospace" font-size="12" fill="#ecf0f1" text-anchor="middle">conference_talk</text>
      <text x="490" y="370" font-family="monospace" font-size="11" fill="#ecf0f1" text-anchor="middle">1280x720 • 45:12</text>
    </g>

    <!-- Thumbnail 3 - Marked -->
    <g id="thumb3">
      <rect x="640" y="180" width="250" height="250" fill="url(#videoGrad3)" stroke="#dc3545" stroke-width="6" rx="3"/>
      <text x="765" y="300" font-family="sans-serif" font-size="48" fill="#ecf0f1" text-anchor="middle">▶</text>
      <text x="765" y="230" font-family="monospace" font-size="12" fill="#ecf0f1" text-anchor="middle">tutorial_part1</text>
      <text x="765" y="370" font-family="monospace" font-size="11" fill="#ecf0f1" text-anchor="middle">1920x1080 • 12:45</text>
    </g>

    <!-- Thumbnail 4 -->
    <g id="thumb4">
      <rect x="915" y="180" width="250" height="250" fill="url(#videoGrad4)" stroke="#495057" stroke-width="2" rx="3"/>
      <text x="1040" y="300" font-family="sans-serif" font-size="48" fill="#ecf0f1" text-anchor="middle">▶</text>
      <text x="1040" y="230" font-family="monospace" font-size="12" fill="#ecf0f1" text-anchor="middle">demo_video</text>
      <text x="1040" y="370" font-family="monospace" font-size="11" fill="#ecf0f1" text-anchor="middle">3840x2160 • 2:15</text>
    </g>

    <!-- Row 2 -->
    <!-- Thumbnail 5 -->
    <g id="thumb5">
      <rect x="90" y="455" width="250" height="250" fill="url(#videoGrad5)" stroke="#495057" stroke-width="2" rx="3"/>
      <text x="215" y="575" font-family="sans-serif" font-size="48" fill="#ecf0f1" text-anchor="middle">▶</text>
      <text x="215" y="505" font-family="monospace" font-size="12" fill="#ecf0f1" text-anchor="middle">presentation</text>
      <text x="215" y="645" font-family="monospace" font-size="11" fill="#ecf0f1" text-anchor="middle">1280x720 • 28:03</text>
    </g>

    <!-- Thumbnail 6 -->
    <g id="thumb6">
      <rect x="365" y="455" width="250" height="250" fill="url(#videoGrad6)" stroke="#495057" stroke-width="2" rx="3"/>
      <text x="490" y="575" font-family="sans-serif" font-size="48" fill="#ecf0f1" text-anchor="middle">▶</text>
      <text x="490" y="505" font-family="monospace" font-size="12" fill="#ecf0f1" text-anchor="middle">screencast</text>
      <text x="490" y="645" font-family="monospace" font-size="11" fill="#ecf0f1" text-anchor="middle">1920x1080 • 8:22</text>
    </g>
  </g>

  <!-- Mode line at bottom -->
  <rect x="50" y="820" width="1100" height="30" fill="#343a40"/>
  <text x="70" y="840" font-family="monospace" font-size="12" fill="#ffffff">
    Video-Thumbs  |  6 videos  |  2 marked  |  Press ? for help
  </text>

  <!-- Annotations -->
  <!-- Arrow 1: Header line -->
  <line x1="50" y1="140" x2="20" y2="140" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="15" y="145" font-family="sans-serif" font-size="13" fill="#e74c3c" text-anchor="end" font-weight="bold">Dynamic header line</text>
  <text x="15" y="160" font-family="sans-serif" font-size="11" fill="#6c757d" text-anchor="end">Shows info for video at point:</text>
  <text x="15" y="173" font-family="sans-serif" font-size="11" fill="#6c757d" text-anchor="end">mark, filename, dimensions,</text>
  <text x="15" y="186" font-family="sans-serif" font-size="11" fill="#6c757d" text-anchor="end">duration, file size</text>

  <!-- Arrow 2: Marked thumbnail border -->
  <line x1="350" y1="305" x2="380" y2="305" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="355" y="300" font-family="sans-serif" font-size="13" fill="#e74c3c" text-anchor="end" font-weight="bold">Red border =</text>
  <text x="355" y="315" font-family="sans-serif" font-size="13" fill="#e74c3c" text-anchor="end" font-weight="bold">Marked video</text>
  <text x="355" y="332" font-family="sans-serif" font-size="11" fill="#6c757d" text-anchor="end">Syncs with dired marks</text>

  <!-- Arrow 3: Grid layout -->
  <line x1="640" y1="750" x2="640" y2="780" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="640" y="800" font-family="sans-serif" font-size="13" fill="#e74c3c" text-anchor="middle" font-weight="bold">Configurable grid layout</text>
  <text x="640" y="815" font-family="sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">Adjust columns with 'w' or customize variables</text>

  <!-- Arrow 4: Current thumbnail -->
  <line x1="215" y1="435" x2="215" y2="465" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="215" y="485" font-family="sans-serif" font-size="13" fill="#e74c3c" text-anchor="middle" font-weight="bold">Current position</text>
  <text x="215" y="500" font-family="sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">Navigate: n/p/arrows • Play: RET • Mark: m</text>

  <!-- Arrow 5: Thumbnail info -->
  <line x1="1175" y1="580" x2="1205" y2="580" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="1210" y="575" font-family="sans-serif" font-size="13" fill="#e74c3c" text-anchor="start" font-weight="bold">Thumbnail details</text>
  <text x="1210" y="590" font-family="sans-serif" font-size="11" fill="#6c757d" text-anchor="start">Filename, resolution,</text>
  <text x="1210" y="603" font-family="sans-serif" font-size="11" fill="#6c757d" text-anchor="start">and duration overlay</text>

  <!-- Key hints box -->
  <rect x="640" y="455" width="250" height="250" fill="#ffffff" fill-opacity="0.95" stroke="#6c757d" stroke-width="1" rx="5" stroke-dasharray="5,5"/>
  <text x="765" y="485" font-family="monospace" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold">Quick Reference</text>

  <text x="665" y="510" font-family="monospace" font-size="11" fill="#495057"><tspan font-weight="bold">n/p</tspan> - Next/Previous</text>
  <text x="665" y="530" font-family="monospace" font-size="11" fill="#495057"><tspan font-weight="bold">RET</tspan> - Play video</text>
  <text x="665" y="550" font-family="monospace" font-size="11" fill="#495057"><tspan font-weight="bold">m/u</tspan> - Mark/Unmark</text>
  <text x="665" y="570" font-family="monospace" font-size="11" fill="#495057"><tspan font-weight="bold">d</tspan> - Go to dired</text>
  <text x="665" y="590" font-family="monospace" font-size="11" fill="#495057"><tspan font-weight="bold">g/G</tspan> - Regen one/all</text>
  <text x="665" y="610" font-family="monospace" font-size="11" fill="#495057"><tspan font-weight="bold">s</tspan> - Sort menu</text>
  <text x="665" y="630" font-family="monospace" font-size="11" fill="#495057"><tspan font-weight="bold">/</tspan> - Filter menu</text>
  <text x="665" y="650" font-family="monospace" font-size="11" fill="#495057"><tspan font-weight="bold">+/-</tspan> - Resize thumbs</text>
  <text x="665" y="670" font-family="monospace" font-size="11" fill="#495057"><tspan font-weight="bold">q</tspan> - Quit</text>

  <!-- Title at top -->
  <text x="600" y="30" font-family="sans-serif" font-size="24" fill="#212529" text-anchor="middle" font-weight="bold">dired-video-thumbnail UI Overview</text>
</svg>
